<svg width="100%" viewBox="0 0 880 632" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>How evals are generated, reviewed and consumed in the Agentic SDLC</title>
<desc>A six-step lifecycle read top to bottom. Step 1: after the stories are approved the Tech Lead generates an eval manifest with one eval per acceptance criterion. Step 2: a human review gate — you review and approve the evals; this is the spec-freeze point, where you can reclassify how a criterion is checked in place or route a substantial add/remove/reword change back upstream to the Tech Lead, Architect or BA. Step 3: the Test Engineer tags each test with its criterion id. Step 4: the per-story eval gate consumes the manifest and the tagged tests to check that every criterion of a story has a passing tagged test, routing back to the Test Engineer if one is missing. Step 5: a passing story is promoted, minting permanent EVAL ids into a growing corpus. Step 6: every later run and brownfield change replays the corpus as a regression gate, failing if a previously shipped criterion has lost its test. Green steps generate or grow evals; the amber step is your human review gate; blue steps are consumed by agents/gates.</desc>
<defs>
<marker id="ev-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="40" y="32" font-size="18" font-weight="600" fill="#3d3d3a">How evals are generated, reviewed &amp; consumed</text>

<!-- legend -->
<circle cx="392" cy="27" r="6" fill="#e9f6f0" stroke="#0f6e56" stroke-width="1.5"/>
<text x="404" y="31" font-size="12" fill="#5a5955">generated / grown</text>
<circle cx="544" cy="27" r="6" fill="#fbf3e2" stroke="#b5850f" stroke-width="1.5"/>
<text x="556" y="31" font-size="12" fill="#5a5955">your review gate</text>
<circle cx="686" cy="27" r="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
<text x="698" y="31" font-size="12" fill="#5a5955">consumed by agents</text>

<!-- ===== Step 1 — GENERATE (green) ===== -->
<rect x="36" y="77" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">Tech Lead</text>
<rect x="170" y="60" width="520" height="64" rx="10" fill="#e9f6f0" stroke="#0f6e56" stroke-width="1"/>
<text x="186" y="79" font-size="10" font-weight="600" fill="#0f6e56" letter-spacing="0.5">① GENERATED — AFTER STORIES APPROVED</text>
<text x="186" y="98" font-size="14" font-weight="600" fill="#085041">Tech Lead authors the eval manifest</text>
<text x="186" y="115" font-size="11" fill="#3d6f60">one eval per acceptance criterion — e.g. STORY-1 / AC-1</text>
<line x1="430" y1="124" x2="430" y2="148" marker-end="url(#ev-arrow)" stroke="#73726c" stroke-width="1.5"/>

<!-- ===== Step 2 — HUMAN REVIEW GATE (amber) ===== -->
<rect x="36" y="165" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="184" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">You 👤</text>
<rect x="170" y="148" width="520" height="64" rx="10" fill="#fbf3e2" stroke="#b5850f" stroke-width="1"/>
<text x="186" y="167" font-size="10" font-weight="600" fill="#b5850f" letter-spacing="0.5">② HUMAN REVIEW — SPEC-FREEZE GATE</text>
<text x="186" y="186" font-size="14" font-weight="600" fill="#8a6300">You review &amp; approve the evals</text>
<text x="186" y="203" font-size="11" fill="#8a6a2e">approve freezes the spec · set-kind locally · add/remove/reword routes upstream</text>
<!-- feedback branch: substantial change → re-open upstream -->
<path d="M 690 180 L 756 180 L 756 92 L 692 92" fill="none" stroke="#b5850f" stroke-width="1.25" stroke-dasharray="5 3" marker-end="url(#ev-arrow)"/>
<text transform="translate(770 136) rotate(-90)" text-anchor="middle" font-size="10" fill="#b5850f">change → re-open upstream</text>
<line x1="430" y1="212" x2="430" y2="236" marker-end="url(#ev-arrow)" stroke="#73726c" stroke-width="1.5"/>

<!-- ===== Step 3 — TAG (neutral) ===== -->
<rect x="36" y="253" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="272" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">Test Engineer</text>
<rect x="170" y="236" width="520" height="64" rx="10" fill="#f4f3ef" stroke="#7a7974" stroke-width="1"/>
<text x="186" y="255" font-size="10" font-weight="600" fill="#7a7974" letter-spacing="0.5">③ TAG THE TESTS</text>
<text x="186" y="274" font-size="14" font-weight="600" fill="#44443f">Test Engineer tags each test with its criterion id</text>
<text x="186" y="291" font-size="11" fill="#5a5955">xUnit [Trait(criterion, STORY-1/AC-1)]  ·  Vitest it([STORY-1/AC-1] …)</text>
<line x1="430" y1="300" x2="430" y2="324" marker-end="url(#ev-arrow)" stroke="#73726c" stroke-width="1.5"/>

<!-- ===== Step 4 — CONSUME · story gate (blue) ===== -->
<rect x="36" y="345" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="364" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">Eval gate</text>
<rect x="170" y="324" width="520" height="72" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="186" y="343" font-size="10" font-weight="600" fill="#185fa5" letter-spacing="0.5">④ CONSUMED — PER-STORY GATE</text>
<text x="186" y="362" font-size="14" font-weight="600" fill="#0c447c">Eval gate checks the story  (evals.mjs)</text>
<text x="186" y="380" font-size="11" fill="#2f5f95">reads the manifest + tagged tests: every criterion needs a passing test</text>
<!-- feedback branch: missing test → back to Test Engineer -->
<path d="M 690 360 L 738 360 L 738 268 L 692 268" fill="none" stroke="#a32d2d" stroke-width="1.25" stroke-dasharray="5 3" marker-end="url(#ev-arrow)"/>
<text transform="translate(752 314) rotate(-90)" text-anchor="middle" font-size="10" fill="#a32d2d">missing test → back to engineer</text>
<line x1="430" y1="396" x2="430" y2="420" marker-end="url(#ev-arrow)" stroke="#73726c" stroke-width="1.5"/>

<!-- ===== Step 5 — GENERATE / GROW (green) ===== -->
<rect x="36" y="437" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="456" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">Promote</text>
<rect x="170" y="420" width="520" height="64" rx="10" fill="#e9f6f0" stroke="#0f6e56" stroke-width="1"/>
<text x="186" y="439" font-size="10" font-weight="600" fill="#0f6e56" letter-spacing="0.5">⑤ PROMOTE — GROWS THE PERMANENT CORPUS</text>
<text x="186" y="458" font-size="14" font-weight="600" fill="#085041">A passing story is promoted into evals/</text>
<text x="186" y="475" font-size="11" fill="#3d6f60">mints EVAL-0001, EVAL-0002 … kept forever, one per shipped criterion</text>
<line x1="430" y1="484" x2="430" y2="508" marker-end="url(#ev-arrow)" stroke="#73726c" stroke-width="1.5"/>

<!-- ===== Step 6 — CONSUME · regression gate (blue) ===== -->
<rect x="36" y="531" width="118" height="30" rx="15" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
<text x="95" y="550" text-anchor="middle" font-size="12" font-weight="500" fill="#44443f">Every run</text>
<rect x="170" y="508" width="520" height="72" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="186" y="527" font-size="10" font-weight="600" fill="#185fa5" letter-spacing="0.5">⑥ CONSUMED — REGRESSION GATE (FOREVER)</text>
<text x="186" y="546" font-size="14" font-weight="600" fill="#0c447c">Every later run &amp; brownfield change replays the corpus</text>
<text x="186" y="564" font-size="11" fill="#2f5f95">a previously shipped criterion that lost its test fails the run</text>

<text x="40" y="612" font-size="11" fill="#5a5955">Generated at ① and ⑤ (green) · your review &amp; spec freeze at ② (amber) · consumed by gates at ④ and ⑥ (blue). The corpus only grows.</text>
</svg>
